[project]
name = "budcli"
version = "0.1.0"
description = "Eats csv bank statements, categorizes transactions, and tracks your budget."
readme = "README.md"
authors = [
    { name = "Teemu Taivainen", email = "teemu.taivainen@hotmail.fi" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "platformdirs>=4.11.4",
    "pydantic>=2.13.4",
    "typer>=0.15.3",
]

[project.scripts]
budcli = "budcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "standard"
