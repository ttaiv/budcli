[project]
name = "budcli"
version = "0.1.0"
description = "Eats csv bank statements, categorizes transactions, and tracks your budget."
readme = "README.md"
authors = [
    { name = "Teemu Taivainen", email = "teemu.taivainen@hotmail.fi" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "typer>=0.15.3",
]

[project.scripts]
bc = "budcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
