[project]
name = "budcli"
version = "0.1.0"
description = "Eats csv bank statements, categorizes transactions, and tracks your budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Teemu Taivainen", email = "ttaiv@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "platformdirs>=4.11.4",
    "pydantic>=2.13.4",
    "typer>=0.15.3",
]

[project.scripts]
budcli = "budcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # Line length is handled by the formatter.

[tool.pytest.ini_options]
testpaths = ["tests"]
